name: Personal Assistant checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npx expo export --platform web --output-dir dist
        env:
          CI: 1
          EXPO_OFFLINE: 1
          EXPO_NO_TELEMETRY: 1
